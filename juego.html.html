<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Juego Luz Morada</title>
  <style>
    :root{--bg:#f6eff9;--panel:#f3e9fb;--accent:#c9a6f0;--text:#2b1b2f}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,var(--bg),#efe7fb);display:flex;align-items:center;justify-content:center;height:100vh}
    .card{width:900px;max-width:95%;background:var(--panel);border-radius:14px;padding:18px;box-shadow:0 10px 30px rgba(90,40,120,0.12)}
    header{display:flex;align-items:center;gap:12px}
    h1{margin:0;color:#3b1e45;font-size:20px}
    .board{display:flex;gap:16px;margin-top:12px}
    .play{flex:1;background:linear-gradient(180deg,#fff,#f9f4ff);border-radius:10px;padding:12px}
    canvas{width:100%;height:480px;border-radius:8px;display:block;background:transparent}
    .side{width:240px}
    .btn{background:var(--accent);color:#fff;padding:8px 12px;border-radius:10px;border:none;cursor:pointer;margin:6px 0}
    .hint{margin-top:8px;padding:10px;border-radius:8px;background:rgba(217,199,250,0.6);color:#3b1a4a}
    @media(max-width:720px){canvas{height:320px}.side{display:none}}
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div>
        <h1>Luz Morada — Minijuego</h1>
        <div style="color:#5a3a68">Colores morados claritos. Reintentos ilimitados.</div>
      </div>
      <div style="margin-left:auto">
        <button class="btn" id="restart">Reiniciar</button>
      </div>
    </header>
    <div class="board">
      <div class="play">
        <canvas id="game"></canvas>
        <div class="hint">Recoge estrellas moradas, evita nubes grises. Si pierdes, pulsa Reiniciar y vuelve a intentarlo.</div>
      </div>
      <aside class="side">
        <div style="background:linear-gradient(180deg,#efe0ff,#f7edff);padding:12px;border-radius:10px;text-align:center">
          <div style="font-size:28px" id="score">0</div>
          <div>Puntos</div>
        </div>
        <button class="btn" id="start">Comenzar</button>
        <button class="btn" id="easy">Modo fácil</button>
        <button class="btn" id="hard">Modo difícil</button>
      </aside>
    </div>
  </div>
  <script>
    // Juego sencillo: mover un círculo (jugador) con ratón/tacto, recoger estrellas, evitar nubes
    const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight}window.addEventListener('resize',resize);resize();
    let player={x:100,y:100,r:18,alive:true};let stars=[];let clouds=[];let score=0;let running=false;let speed=1.6;function rand(min,max){return Math.random()*(max-min)+min}
    function spawn(){stars=[];clouds=[];score=0;for(let i=0;i<8;i++){stars.push({x:rand(80,canvas.width-80),y:rand(60,canvas.height-80),r:10,angle:Math.random()*Math.PI*2})}for(let i=0;i<5;i++){clouds.push({x:rand(canvas.width,canvas.width*2),y:rand(40,canvas.height-80),w:60+hRand(),h:30})}}
    function hRand(){return rand(0,40)}
    function start(){running=true;player.alive=true;spawn();}
    function restart(){start();}
    document.getElementById('start').addEventListener('click',start);document.getElementById('restart').addEventListener('click',restart);
    // input
    canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();player.x=(e.clientX-r.left);player.y=(e.clientY-r.top)});
    canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const r=canvas.getBoundingClientRect();player.x=(t.clientX-r.left);player.y=(t.clientY-r.top)},{passive:false});
    function update(dt){if(!running) return; // move clouds left
      for(let c of clouds){c.x-=1.2*speed; if(c.x<-100) c.x=canvas.width+rand(20,400);}
      // collect stars
      for(let i=stars.length-1;i>=0;i--){const s=stars[i];const dx=s.x-player.x;const dy=s.y-player.y;const d=Math.hypot(dx,dy);if(d<player.r+ s.r){stars.splice(i,1);score+=10}}
      // collisions with clouds
      for(let c of clouds){const dx=(c.x)-(player.x);const dy=(c.y)-(player.y);if(Math.abs(dx)<(c.w/2+player.r) && Math.abs(dy)<(c.h/2+player.r)){player.alive=false;running=false}}
      if(stars.length===0){ // win wave: respawn with more challenge
        for(let i=0;i<8;i++){stars.push({x:rand(80,canvas.width-80),y:rand(60,canvas.height-80),r:10})}
        speed*=1.04
      }
    }
    function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);
      // background soft purple
      const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#fff');g.addColorStop(1,'#f6eff9');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
      // stars
      for(const s of stars){ctx.beginPath();ctx.fillStyle='#caa6f8';ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
      // clouds
      for(const c of clouds){ctx.fillStyle='rgba(120,110,140,0.16)';ctx.beginPath();ctx.ellipse(c.x,c.y,c.w,c.h,0,0,Math.PI*2);ctx.fill()}
      // player
      ctx.beginPath();ctx.fillStyle=player.alive? '#a97ff2':'#b0a0b8';ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
      // score
      document.getElementById('score').textContent=score;
    }
    let last=performance.now();function loop(t){const dt=(t-last)/1000;last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
  </script>
</body>
</html>
