<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de ánimo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f6ecff 0%, #fff4ff 100%);
      color: #3c1f5f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      max-width: 540px;
      width: 100%;
      padding: 28px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 18px 40px rgba(123, 86, 220, 0.18);
      border: 1px solid rgba(163, 127, 238, 0.28);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      color: #7a58ee;
    }
    p {
      margin: 0 0 18px;
      color: #5f4b8b;
      line-height: 1.6;
    }
    .status {
      margin-top: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #563e8c;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .card {
      background: #f4e9ff;
      border: 1px solid #dcc6ff;
      border-radius: 18px;
      padding: 16px 14px;
      color: #4c2a7e;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
      box-shadow: 0 10px 20px rgba(138, 95, 214, 0.12);
    }
    .card:hover:not(:disabled) {
      transform: translateY(-3px);
      background: #e9dcff;
    }
    .card:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .attempts {
      margin: 18px auto 0;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .life {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #9f7bff;
      box-shadow: inset 0 0 0 1px rgba(118, 74, 255, 0.45);
    }
    .life.empty {
      background: #f8efff;
      border: 1px solid #e7d7ff;
    }
    .message {
      margin-top: 20px;
      color: #5c498e;
      line-height: 1.7;
    }
    button#resetBtn {
      margin-top: 24px;
      background: #d8c1ff;
      color: #33205a;
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.18s ease;
    }
    button#resetBtn:hover {
      background: #c8aaff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Juego de ánimo</h1>
    <p>Elige la palabra que mejor describe una emoción clara y positiva. Tienes varios intentos, cada elección te acerca más a un mensaje amable.</p>
    <div class="status">Intenta adivinar la palabra secreta.</div>
    <div class="attempts" aria-label="Vidas restantes"></div>
    <div class="grid">
      <button class="card option">Brillo</button>
      <button class="card option">Tristeza</button>
      <button class="card option">Calma</button>
      <button class="card option">Resiliencia</button>
    </div>
    <div class="message">¡Empieza cuando quieras! Si fallas, vuelve a intentarlo con calma.</div>
    <button id="resetBtn">Reiniciar juego</button>
  </div>
  <script>
    const secretWords = ["Brillo", "Calma", "Resiliencia"];
    const secretWord = secretWords[Math.floor(Math.random() * secretWords.length)];
    let attempts = 5;
    const statusEl = document.querySelector('.status');
    const messageEl = document.querySelector('.message');
    const attemptEl = document.querySelector('.attempts');
    const options = document.querySelectorAll('.option');
    const resetBtn = document.getElementById('resetBtn');
    const hints = [
      'Recuerda respirar hondo, puedes seguir intentándolo.',
      'Cada intento te ayuda a concentrarte más.',
      'Está bien no acertar siempre, tienes otra oportunidad.',
      'Cada paso cuenta. Sigue con confianza.',
      'Último intento, confía en ti.'
    ];
    function updateAttempts() {
      attemptEl.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const dot = document.createElement('span');
        dot.className = 'life' + (i < attempts ? '' : ' empty');
        attemptEl.appendChild(dot);
      }
    }
    function endGame(win) {
      options.forEach(btn => btn.disabled = true);
      if (win) {
        statusEl.textContent = '¡Lo lograste!';
        messageEl.textContent = 'Has encontrado una palabra hermosa. Tu ánimo merece un aplauso.';
      } else {
        statusEl.textContent = 'Juego terminado';
        messageEl.textContent = `La palabra secreta era "${secretWord}". Puedes volver a jugar y seguir cuidando tu ánimo.`;
      }
    }
    options.forEach(button => {
      button.addEventListener('click', () => {
        if (attempts === 0) return;
        const chosen = button.textContent.trim();
        if (chosen === secretWord) {
          endGame(true);
        } else {
          attempts--;
          if (attempts > 0) {
            statusEl.textContent = 'Incorrecto, intenta otra vez.';
            messageEl.textContent = hints[5 - attempts - 1] || 'Sigue adelante.';
          } else {
            statusEl.textContent = 'No quedan intentos';
            messageEl.textContent = 'Tómate un momento. Está bien volver a intentarlo cuando te sientas listo.';
          }
          updateAttempts();
          if (attempts === 0) endGame(false);
        }
      });
    });
    resetBtn.addEventListener('click', () => window.location.reload());
    updateAttempts();
  </script>
</body>
</html>
